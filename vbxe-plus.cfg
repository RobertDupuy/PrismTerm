FEATURES { STARTADDRESS: default = $2800; }
SYMBOLS { __STARTADDRESS__: type = export, value = %S; }
MEMORY {
 ZP: file = "", define = yes, start = $0082, size = $007E;
 UI: file = "%O.UI", start = $5000, size = $3000, fill = yes;
 BANK: file = "%O.TRANS", start = $4000, size = $4000, fill = yes;
 EXTRA: file = %O, start = $B000, size = $1000;
 MAIN: file = %O, define = yes, start = %S, size = $A000 - %S;
}
FILES { %O: format = atari; }
FORMATS { atari: runad = start; }
SEGMENTS {
 ZEROPAGE: load = ZP, type = zp, optional = yes;
 CODE: load = MAIN, type = rw, define = yes;
 RODATA: load = MAIN, type = ro, optional = yes;
 DATA: load = MAIN, type = rw, optional = yes;
 PROTOCOL: load = BANK, type = rw;
 UI: load = UI, type = rw;
 RESIDENT: load = EXTRA, type = rw;
 BSS: load = MAIN, type = bss, optional = yes, define = yes;
}
